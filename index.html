<style>

  --f1:#9CC9F5; --f2:#CDE7FF; --f3:#FBE3A3; --f4:#A9E3C4; --f5:#F9C6CF; --bub:rgba(255,255,255,.9);

  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --glass:rgba(22,40,66,.38); --glass-strong:rgba(18,32,54,.88); --glass-hi:rgba(255,255,255,.20);
  --glass-border:rgba(255,255,255,.16); --line:rgba(255,255,255,.09); --field:rgba(6,14,28,.42);
  --shadow:0 20px 55px rgba(0,0,0,.45);
  --sun:#FFD25E; --grass:#52D394; --sky:#6CB2F6; --coral:#FF8494;
  --grass-soft:rgba(82,211,148,.06); --sky-soft:rgba(108,178,246,.06);
  --f1:#1A4F94; --f2:#0D2C55; --f3:#6E5418; --f4:#145E44; --f5:#6A2638; --bub:rgba(180,220,255,.55);
  --accent2:#3FD0DE;
  --y1:#7FE0A0; --y1-soft:rgba(127,224,160,.16); --y2:#FFB067; --y2-soft:rgba(255,176,103,.16);
  --y3:#8DBBFF; --y3-soft:rgba(141,187,255,.16); --y5:#FF8A9A; --y5-soft:rgba(255,138,154,.16);
  --hit:#6B5A12; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#EEF5FD; --muted:#A9BCD0; --bg:#071225;
  --glass:rgba(22,40,66,.38); --glass-strong:rgba(18,32,54,.88); --glass-hi:rgba(255,255,255,.20);
  --glass-border:rgba(255,255,255,.16); --line:rgba(255,255,255,.09); --field:rgba(6,14,28,.42);
  --shadow:0 20px 55px rgba(0,0,0,.45);
  --sun:#FFD25E; --grass:#52D394; --sky:#6CB2F6; --coral:#FF8494;
  --grass-soft:rgba(82,211,148,.06); --sky-soft:rgba(108,178,246,.06);
  --f1:#1A4F94; --f2:#0D2C55; --f3:#6E5418; --f4:#145E44; --f5:#6A2638; --bub:rgba(180,220,255,.55);
  --accent2:#3FD0DE;

  --y3:#8DBBFF; --y3-soft:rgba(141,187,255,.16); --y5:#FF8A9A; --y5-soft:rgba(255,138,154,.16);
  --hit:#6B5A12; color-scheme:dark}
html{background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:

  radial-gradient(90% 70% at 100% 30%,color-mix(in srgb,var(--f1) 30%,transparent) 0%,transparent 65%),

}
.glass,.unit,.finder,.coord,.rwrap,.tabs button,.filters,.search input,header.top,.summary,.st-head,.kpi,.st-card,.st-tbl{
  position:relative;background:linear-gradient(135deg,var(--glass-hi) -40%,var(--glass) 40%);

  box-shadow:var(--shadow),inset 1px 1px 0 rgba(255,255,255,.45),inset -1px -1px 0 rgba(255,255,255,.06)}

  .glass,.unit,.finder,.coord,.rwrap,.tabs button,.filters,.search input,header.top,.summary,.st-head,.kpi,.st-card,.st-tbl{background:var(--glass-strong)}}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}

.lede{margin:2px 0 0;color:var(--muted);font-size:14px}
.theme{display:inline-flex;padding:3px;border-radius:999px;gap:2px;background:var(--field);border:1px solid var(--line);flex:none}
.theme button{appearance:none;border:0;background:transparent;color:var(--muted);width:34px;height:34px;padding:0;border-radius:999px;cursor:pointer;display:grid;place-items:center;transition:background .15s,color .15s}

.controls[hidden],.legend[hidden]{display:none!important}

.dot{width:10px;height:10px;border-radius:50%}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}

.tabs button[aria-selected="true"]{background:linear-gradient(120deg,color-mix(in srgb,var(--sky) 22%,var(--glass-strong)),color-mix(in srgb,var(--accent2) 18%,var(--glass-strong)));color:var(--sky);border-color:color-mix(in srgb,var(--sky) 35%,transparent);box-shadow:0 10px 24px color-mix(in srgb,var(--sky) 18%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.tabs button[aria-selected="true"] small{color:var(--muted)}
.tabs button.sum[aria-selected="true"]{background:color-mix(in srgb,var(--grass) 18%,var(--glass-strong));color:var(--grass);border-color:color-mix(in srgb,var(--grass) 35%,transparent);box-shadow:0 10px 24px color-mix(in srgb,var(--grass) 18%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters{display:inline-flex;padding:4px;border-radius:999px;gap:2px}

.filters button[aria-pressed="true"]{background:var(--glass-strong);color:var(--sky);font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.10)}
.search{flex:1 1 220px;min-width:0}
.search input{width:100%;font:16px var(--f-body);padding:11px 18px;border-radius:999px;color:var(--ink)}

.finder{border-radius:24px;padding:14px 18px;font-size:14.5px}

.sumbar{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}

.summary{display:flex;gap:18px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px;padding:10px 18px;border-radius:20px}

.dl button:hover{border-color:color-mix(in srgb,var(--sky) 40%,transparent);color:var(--sky)}

.heads{border-radius:26px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}

.heads .copy svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.heads .hdt{font:500 16px var(--f-display);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.heads .dpill{font:600 12px var(--f-body);color:var(--sky);background:color-mix(in srgb,var(--sky) 12%,var(--glass-strong));border:1px solid color-mix(in srgb,var(--sky) 25%,transparent);border-radius:999px;padding:2px 10px}
.heads .hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}

.heads .hm b{font:500 15px var(--f-display);display:block}
.heads .hm small{display:block;font-size:12px;color:var(--muted);line-height:1.3}

.heads .lab.s{color:var(--sky)} .heads .lab.l{color:var(--grass)}
.heads textarea{width:100%;min-height:140px;font:13px var(--f-body);border-radius:12px;padding:8px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--glass-strong);color:var(--ink);border:1px solid var(--glass-border);border-radius:999px;padding:9px 18px;font-size:14px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.summary strong{color:var(--ink);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin:0 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));gap:14px}
.unit{border-radius:28px;overflow:hidden;min-width:0}
.unit h2{font-size:19px;font-weight:500;margin:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.unit h2 .ico{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;font-size:17px;margin-right:8px;background:color-mix(in srgb,var(--sky) 14%,var(--glass-strong));color:var(--sky);border:1px solid color-mix(in srgb,var(--sky) 25%,transparent);font-family:var(--f-display);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}

.cols{display:grid;grid-template-columns:92px 1fr 1fr}

.rwrap{overflow-x:auto;border-radius:26px}

[hidden]{display:none!important}

  const kind=b.dataset.dl, btns=[...document.querySelectorAll("#dl button")];
  btns.forEach(x=>x.disabled=true);
  try{
    let filename,data;
    if(kind==="pdfall"){const cs=[];for(let i=0;i<DATA.length;i++)cs.push(...await dayPages(i));data=makePdf(cs);filename="แบ่งโม สพอ. 2569 (ทั้ง 3 วัน).pdf"}
    else{const c=await drawDay(day);const dn=DATA[day].day;
      if(kind==="png"){const cu=await drawDayUI(day);data=await new Promise(r=>cu.toBlob(r,"image/png"));filename=`แบ่งโม สพอ. ${dn}.png`}
      else{data=makePdf(await dayPages(day));filename=`แบ่งโม สพอ. ${dn}.pdf`}}
    const r=await downloads.save({filename,data});
    toast(r.status==="saved"?"บันทึกไฟล์แล้ว":"ส่งไฟล์แล้ว");
  }catch(err){
    const code=err&&err.code;
    if(code==="declined")toast("ยกเลิกการบันทึก");
    else if(code==="rate_limited")toast("มีหน้าต่างบันทึกเปิดอยู่ ลองอีกครั้งสักครู่");
    else if(["unavailable","not_granted","capability_disabled","capability_removed"].includes(code)){downloads=null;syncDl();toast("หน้านี้บันทึกไฟล์ไม่ได้")}
    else toast("สร้างไฟล์ไม่สำเร็จ ลองอีกครั้ง");
  }finally{btns.forEach(x=>x.disabled=false)}
});
const browserDownloads={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data]);const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return {status:"saved"}}};
(async()=>{try{downloads=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){downloads=null}if(!downloads&&!(window.claude&&window.claude.use))downloads=browserDownloads;syncDl()})();

(function(){
  const root=document.documentElement;
  const btns=[...document.querySelectorAll("[data-theme-set]")];
  function apply(m){
    if(m==="light"||m==="dark")root.setAttribute("data-theme",m);else root.removeAttribute("data-theme");
    btns.forEach(b=>b.setAttribute("aria-pressed",b.dataset.themeSet===m));
  }
  let m="auto";try{m=localStorage.getItem("spo-theme")||"auto"}catch(e){}
  apply(m);
  btns.forEach(b=>b.addEventListener("click",()=>{m=b.dataset.themeSet;try{localStorage.setItem("spo-theme",m)}catch(e){}apply(m)}));
})();
</script>
